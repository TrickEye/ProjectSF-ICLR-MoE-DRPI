[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drpi"
version = "0.1.0"
description = "Dynamic Route-Preserving Intervention research toolkit"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.2,<2",
  "huggingface-hub>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.4,<3",
  "transformers>=4.49,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
